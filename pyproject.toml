[project]
name = "goldman"
version = "0.1.0"
description = "FE 5108 Midterm Project — mean–variance portfolios, the CAPM SML, and factor models on real data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
# One-shot network downloader (scripts/download_data.py). Not needed to run.
data = [
    "pandas-datareader>=0.10",
    "yfinance>=0.2.40",
]
# Notebook workflow (notebooks/).
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
]

[project.scripts]
goldman = "goldman.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/goldman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/goldman/exhibits/*.py" = ["E402"]  # matplotlib.use before pyplot