[project]
name = "goldman"
version = "0.1.0"
description = "FE 5108 Project — mean–variance portfolios, the CAPM SML, and factor models on real data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "qbstyles>=0.1.4",
    "scipy>=1.11",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
# Explicit, network-only fetchers (goldman.data.fetch). Not needed to run.
data = [
    "pandas-datareader>=0.10",
    "yfinance>=0.2.40",
]
# Notebook workflow (notebooks/).
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/goldman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=goldman --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["goldman"]
# Network-only fetchers, never imported by the pipeline or the tests.
omit = ["src/goldman/data/fetch.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]  # notebooks are executed, not linted

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/goldman/analysis/*.py" = ["E402"]  # matplotlib.use before pyplot
